- id: CA-RENT
  doc: D024
  jurisdiction: CA
  category: rent_increase_limits
  citation: Cal. Civ. Code § 1947.12
  effect: protection_or_duty
  document_status: enacted
  events:
    - {kind: effective, date: "2024-01-01"}
    - {kind: operative, date: "2024-04-01"}
    - {kind: repealed, date: "2030-01-01"}
  key_value: 5% plus CPI, max 10% per 12 months
  cap_low: 5
  cap_high: 10
  applies_if: always
  exempt_if:
    any:
      - {fact: building.affordable_restricted, op: eq, value: true}
      - {fact: building.use_class, op: eq, value: dormitory}
      - all: [{age: building.certificate_date, op: lt, years: 15}, {fact: building.use_class, op: ne, value: mobilehome}]
      - all:
          - {fact: building.separately_alienable, op: eq, value: true}
          - not: {fact: landlord.owner_type, op: in, values: [reit, corporation, llc_with_corporate_member]}
      - all: [{fact: building.units, op: le, value: 2}, {fact: landlord.owner_occupied, op: eq, value: true}]
  interactions:
    - {kind: exempt_where_local_rule_stricter, target_category: rent_increase_limits}
  base:
    title: Tenant Protection Act rent cap
    requirement: >-
      An owner may not raise rent over any 12-month period by more than 5% plus the change in the cost of
      living, or 10%, whichever is lower. Operative April 1, 2024; repealed as of January 1, 2030.
    key_value: 5% plus CPI, max 10%
    coverage_conditions: Residential real property in California.
    exemptions: >-
      Deed-restricted affordable housing; school dormitories; housing issued a certificate of occupancy within
      the previous 15 years (except mobilehomes); single-family homes and condominiums not owned by a REIT,
      corporation or LLC with a corporate member (with the statutory notice); owner-occupied duplexes; housing
      subject to local rent control that restricts annual increases to less than this section.
    interaction: Does not apply where a stricter local rent control ordinance covers the unit.
    effective_date: "2024-01-01"
    status: in_force

- id: CA-DEP
  doc: D025
  jurisdiction: CA
  category: security_deposits
  citation: Cal. Civ. Code § 1950.5
  effect: protection_or_duty
  document_status: enacted
  events:
    - {kind: operative, date: "2024-07-01"}
  key_value: one month's rent
  applies_if: always
  exempt_if: never
  value_branches:
    - value: two months' rent
      when:
        all:
          - {fact: landlord.owner_type, op: in, values: [natural_person, llc_natural_persons]}
          - {fact: landlord.portfolio_properties, op: le, value: 2}
          - {fact: landlord.portfolio_units, op: le, value: 4}
          - not: {fact: tenant.service_member, op: eq, value: true}
  base:
    title: Security deposit limit
    requirement: A landlord may not demand or receive security above one month's rent.
    key_value: one month's rent
    coverage_conditions: Residential rentals in California; security collected or demanded on or after July 1, 2024.
    exemptions: >-
      A landlord who is a natural person (or an LLC whose members are all natural persons) and owns no more than
      two residential rental properties with no more than four units in total may take up to two months' rent,
      unless the prospective tenant is a service member.
    interaction: null
    effective_date: "2024-07-01"
    status: in_force

