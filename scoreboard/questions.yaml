- id: S1-jc-screening
  city: "Jersey City, NJ"
  as_of: "2026-10-01"
  card: "What can they check about me?"
  key:
    correct: "New Jersey's Fair Chance in Housing Act (2021) bars asking about criminal history on the initial application; a landlord may check it only after a conditional offer, within limits on which offenses and how far back."
    wrong: "Says a landlord may ask about or screen out any criminal record at any point."
  source: "assertion A15"

- id: S2-la-screening
  city: "Los Angeles, CA"
  as_of: "2026-10-01"
  card: "What can they check about me?"
