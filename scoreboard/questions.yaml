# Chatbot scoreboard question set (issue #20). Written 04.10.2026 before either chatbot was run; never edited
# after seeing an answer. Questions: the six card questions of the address page (docs/PRD.md, "The six
# questions"), asked for a city on a date. Answer key from the challenge's own material only: participant guide
# (data/realpage-starter/README.md §7, §9), dev/change_tests.json, and the brief's rule table as encoded in
# tests/fixtures/assertions.yaml. Not from HomeRule's outputs.
#
# key.correct: what an answer must say to count as correct (status on that date, and the deciding facts).
# key.wrong:   statements that make an answer wrong regardless of the rest.
# Grading: Jev, blind to which chatbot answered, against this key: correct / partly / wrong.
# Changes after the first run are listed per question under key_correction and apply to every arm.

- id: R1-boston-rent
  city: "Boston, MA"
  as_of: "2026-10-01"
  card: "How much can my rent go up?"
  key:
    correct: "There is no rent cap or rent control in Boston. State law bars local rent control, and the 2026 statewide rent-control ballot question was struck before the vote, so no cap applies."
    wrong: "States or implies that a rent cap or rent control limit applies in Boston (e.g. a percentage cap from the ballot question)."
  source: "guide §7 T5 (struck 2026-06-23); brief: state law bars local rent control (assertions A04, A27)"

- id: R2-cambridge-rent
  city: "Cambridge, MA"
  as_of: "2026-10-01"
  card: "How much can my rent go up?"
  key:
    correct: "There is no rent cap or rent control in Cambridge. State law bars local rent control, and the 2026 ballot question was struck."
    wrong: "States or implies that a rent cap or rent control limit applies in Cambridge."
  source: "guide §7 T5; assertions A04, A27"

- id: R3-sf-rent
  city: "San Francisco, CA"
  as_of: "2026-10-01"
  card: "How much can my rent go up?"
  key:
    correct: "It depends on the building. The San Francisco Rent Ordinance limits annual increases for covered units (mostly buildings first occupied before mid-1979); for units it doesn't cover, California's statewide cap (Civil Code 1947.12: 5% plus inflation, at most 10% a year) applies to buildings older than 15 years, with exemptions."
    wrong: "Says there is no limit at all, or gives one number for every San Francisco unit without saying it depends on the building."
  source: "assertions A01 (CA 1947.12), A02 (SF Rent Ordinance); PRD jurisdiction page example (certificate of occupancy before 13.06.1979)"

- id: R4-sd-rent
  city: "San Diego, CA"
  as_of: "2026-10-01"
  card: "How much can my rent go up?"
  key:
    correct: "San Diego has no local rent control. California's statewide cap (Civil Code 1947.12: 5% plus inflation, at most 10% a year) applies to most buildings older than 15 years, with exemptions (e.g. some single-family homes)."
    wrong: "Says San Diego has its own local rent control ordinance, or that no limit applies to any unit."
  source: "assertions A01; brief: San Diego's local law in scope is the algorithmic ban"

- id: E1-sf-eviction
  city: "San Francisco, CA"
  as_of: "2026-10-01"
  card: "When can they end my tenancy?"
  key:
    correct: "Only for a just cause listed in the San Francisco Rent Ordinance (Admin. Code 37.9) for covered units, with notice and relocation payments for no-fault evictions; California's statewide just-cause law (Civil Code 1946.2) covers most other tenancies after 12 months."
    wrong: "Says a landlord can end a tenancy without cause in San Francisco."
  source: "assertions A05, A07"

- id: E2-newark-eviction
  city: "Newark, NJ"
  as_of: "2026-10-01"
  card: "When can they end my tenancy?"
  key:
    correct: "Only for one of the good causes listed in New Jersey's Anti-Eviction Act (N.J.S.A. 2A:18-61.1), which applies statewide to most residential tenancies, with notice requirements."
    wrong: "Says a landlord can end a tenancy without cause, e.g. simply by not renewing the lease."
  source: "assertion A06"

- id: D1-sd-deposit
  city: "San Diego, CA"
  as_of: "2026-10-01"
  card: "How much deposit can they ask?"
  key:
    correct: "At most one month's rent (California Civil Code 1950.5 as amended by AB 12, in effect since 1 July 2024), with an exception allowing two months for certain small landlords."
    wrong: "Gives two or three months' rent as the general limit (the pre-July 2024 rule)."
  source: "assertion A08 (AB 12, eff. 2024-07-01)"

- id: D2-newark-deposit
  city: "Newark, NJ"
  as_of: "2026-10-01"
  card: "How much deposit can they ask?"
  key:
    correct: "At most one and a half months' rent (N.J.S.A. 46:8-21.2)."
    wrong: "Gives a different general maximum (e.g. one month or two months)."
  source: "assertion A09"

- id: D3-cambridge-deposit
