- id: A1-la-alg-before
  city: "Los Angeles, CA"
  as_of: "2025-12-31"
  card: "Can rent-setting software be used on my rent?"
  key:
    correct: "On 31 December 2025 California's ban on common pricing algorithms (AB 325, Cartwright Act) is enacted but not yet in effect; it takes effect on 1 January 2026."
    wrong: "Says the statewide ban already applies on 31 December 2025, or that no such law exists."
  source: "guide §7 T1; assertion A17"

- id: A2-la-alg-after
  city: "Los Angeles, CA"
  as_of: "2026-01-02"
  card: "Can rent-setting software be used on my rent?"
  key:
    correct: "Since 1 January 2026 California law (AB 325, Cartwright Act Bus. & Prof. Code 16729) makes it unlawful to use or distribute a common pricing algorithm as part of a contract, combination or conspiracy to restrain trade, or to coerce someone into adopting its recommended rent; an answer may say this is not a ban on every use of such software."
    wrong: "Says there is no law on it in Los Angeles on 2 January 2026, or that it is not yet in effect."
  source: "guide §7 T1; assertion A17; Bus. & Prof. Code 16729(a)-(b)"
  key_correction: "Corrected after the first run (04.10.2026): the first key said AB 325 'bans using a common pricing algorithm to set rents', which overstates 16729(a). All arms re-graded against the corrected key."

