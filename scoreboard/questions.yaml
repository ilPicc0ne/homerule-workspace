- id: F3-boston-fee
  city: "Boston, MA"
  as_of: "2026-10-01"
  card: "What can they charge me to apply?"
  key:
    correct: "Under G.L. c.186 §15B a landlord may charge at the start of a tenancy only first month's rent, last month's rent, a security deposit (at most one month) and the cost of a new lock; an application fee is not among them. Since 1 August 2025 the landlord's broker fee is paid by whoever hired the broker."
    wrong: "Says a landlord may charge an application fee of some amount in Massachusetts."
